name: Uji Windows dan terbitkan rilis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sedot-abis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pasang dependensi
        run: python -m pip install -r requirements.txt
      - name: Uji logika dan regresi GUI
        run: python -m unittest discover -s tests -v
      - name: Buat ZIP dan checksum
        run: python scripts/build_release.py
      - name: Publikasikan rilis baru
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $version = (Select-String -Path sedot_abis.py -Pattern '^VERSION = "([0-9.]+)"$').Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Rilis $tag sudah tersedia; tidak ditimpa."
            exit 0
          }
          gh release create $tag "dist/Sedot-Abis-v$version.zip" "dist/SHA256SUMS.txt" --target $env:RELEASE_COMMIT --title "Sedot Abis $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
